<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EcoGlow Skincare | Product Enquiry</title>

    <link rel="stylesheet" href="css/style.css">

   
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            min-height: 100vh;
            background: linear-gradient(-45deg, #994ab9, #ac9ce6, #6200ff, #511d62);
            background-size: 400% 400%;
            animation: neonShift 10s ease infinite;
        }

        @keyframes neonShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Header */
        header {
            background: rgba(35, 10, 65, 0.80);
            padding: 20px;
            text-align: center;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
        }

        header h1 {
            margin: 0 0 18px;
            font-size: 2.5rem;
            color: white;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.45);
        }

        /* Navigation */
        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.12);
            transition: 0.3s ease;
        }

        nav a:hover {
            background: #ef8be7;
            color: #34105e;
            transform: translateY(-2px);
        }

        /* Main content */
        main {
            max-width: 900px;
            margin: auto;
            padding: 50px 20px;
        }

        /* Page introduction */
        .hero {
            text-align: center;
            padding: 55px 25px;
            margin-bottom: 35px;

            background: rgba(255, 255, 255, 0.11);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 28px;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 35px rgba(20, 0, 50, 0.35);
        }

        .hero h2 {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #ffe5fc;
        }

        .hero p {
            font-size: 1.15rem;
            line-height: 1.7;
        }

        /* Enquiry section */
        .enquiry-section {
            background: rgba(255, 255, 255, 0.10);
            padding: 40px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 30px rgba(20, 0, 50, 0.3);
        }

        .enquiry-section h2 {
            text-align: center;
            color: #ffd4f8;
            font-size: 2rem;
            margin-bottom: 30px;
        }

        /* Form */
        form {
            max-width: 700px;
            margin: auto;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            font-weight: bold;
            color: #ffe3fa;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.12);
            color: white;
            font-size: 1rem;
            outline: none;
            -webkit-backdrop-filter: blur(5px);
            backdrop-filter: blur(5px);
        }

        input::placeholder,
        textarea::placeholder {
            color: rgba(255, 255, 255, 0.65);
        }

        input:focus,
        textarea:focus {
            border-color: #f39be8;
            box-shadow: 0 0 12px rgba(239, 139, 231, 0.35);
        }

        textarea {
            resize: vertical;
            min-height: 150px;
        }

        /* Submit button */
        button {
            display: block;
            margin: 28px auto 0;

            padding: 14px 32px;
            border: none;
            border-radius: 30px;

            background: linear-gradient(45deg, #ff8edb, #c879ff);
            color: #32104f;

            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;

            box-shadow: 0 5px 20px rgba(255, 120, 230, 0.4);
            transition: 0.3s ease;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 150, 240, 0.6);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 25px;
            background: rgba(35, 10, 65, 0.82);
            margin-top: 20px;
        }

        /* Mobile responsive */
        @media (max-width: 768px) {

            .hero h2 {
                font-size: 2.2rem;
            }

            .enquiry-section {
                padding: 25px;
            }

            nav ul {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>

<body>

    <!-- Header and Navigation -->
    <header>
        <h1>EcoGlow Skincare</h1>

        <nav aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="product.html">Product Details</a></li>
                <li><a href="about.html">Our Story</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <main>

        <!-- Introduction -->
        <section class="hero">
            <h2>Product Enquiry</h2>

            <p>
                Have a question about our skincare products?
                Send us an enquiry and our team will get back to you.
            </p>
        </section>

        <!-- Enquiry Form -->
        <section class="enquiry-section">

            <h2>Send Us an Enquiry</h2>

            <form action="#" method="post">

                <label for="name">Name:</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

                <label for="email">Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    required
                >

                <label for="subject">Subject:</label>
                <input
                    type="text"
                    id="subject"
                    name="subject"
                    placeholder="What is your enquiry about?"
                    required
                >

                <label for="message">Message:</label>
                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    placeholder="Type your message here..."
                    required
                ></textarea>

                <button type="submit">Submit Enquiry</button>

            </form>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 EcoGlow Skincare. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
